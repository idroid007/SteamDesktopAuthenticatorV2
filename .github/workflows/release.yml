name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Installers first, and on their own. Publishing to npm needs a token that a
  # fork or a fresh clone will not have, and a missing token should never stop
  # people getting a download.
  desktop:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      # Actions are pinned by commit SHA. A tag can be moved to point at other
      # code; a SHA cannot.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build the packages
        run: npm run build

      - name: Test
        run: npm test

      # electron-builder shells out to these when it writes deb and AppImage
      # packages, and a bare runner does not always carry them.
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot libarchive-tools

      - name: Package the desktop app
        id: package
        # Keep the output. When a target fails, this log is the only thing that
        # says why, and job logs need repository access to read.
        run: |
          set -o pipefail
          npm run package -w @sda/desktop 2>&1 | tee packaging-${{ matrix.os }}.log
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing certificate, so do not go looking for one.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Ubuntu 24.04 ships without libfuse2, so AppImage tooling has to
          # unpack itself rather than mount.
          APPIMAGE_EXTRACT_AND_RUN: 1
          DEBUG: ${{ runner.os == 'Linux' && 'electron-builder' || '' }}

      # A failed target should not cost the other targets their upload, and the
      # log gets attached either way so a failure can be read without needing
      # access to the run.
      - name: Report what was built
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo '```'
            ls -la packages/desktop/release 2>/dev/null || echo "no release directory"
            echo '```'
            echo "<details><summary>Packaging log tail</summary>"
            echo '```'
            tail -n 60 packaging-${{ matrix.os }}.log 2>/dev/null || echo "no log"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          # Deliberately not copied into release/: the summary above carries
          # the tail, and a log does not belong on a download page.

      - name: Checksums for every artifact
        shell: bash
        run: |
          cd packages/desktop/release
          rm -f SHA256SUMS.txt
          for f in *.exe *.dmg *.zip *.AppImage *.deb *.tar.gz; do
            [ -f "$f" ] && sha256sum "$f" >> "SHA256SUMS-${{ matrix.os }}.txt"
          done
          cat "SHA256SUMS-${{ matrix.os }}.txt" || true

      - name: Attach to the release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.dmg
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.tar.gz
            packages/desktop/release/*.zip
            packages/desktop/release/SHA256SUMS-*.txt

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Runs only when a token is configured, so the installers above never wait
    # on it and never fail because of it.
    if: ${{ github.event_name == 'push' }}
    continue-on-error: true
    permissions:
      contents: read
      # Lets npm attest that this build produced this package, tying the
      # published tarball to this commit and this workflow run.
      id-token: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Write SHA256SUMS into each package
        run: node scripts/write-checksums.mjs

      - name: Publish
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: |
          npm publish --provenance --access public -w @sda/core
          npm publish --provenance --access public -w @sda/ui
          npm publish --provenance --access public -w @sda/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
